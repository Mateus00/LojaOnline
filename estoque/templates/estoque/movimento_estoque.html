{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Registrar Movimento de Estoque</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Salvar</button>
    <a href="{% url 'estoque:estoque_view' %}" class="btn btn-secondary">Voltar</a>
  </form>
</div>
{% endblock %}
